<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Volta — Al-Ittihad, 1927</title>
  <meta name="description" content="Volta: an unofficial bilingual fan site on the founding and history of Al-Ittihad Club, Jeddah, est. 1927.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Sans+Arabic:wght@400;600&family=IBM+Plex+Sans:wght@400;600&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#story" data-skip>Skip to content</a>

  <header class="bar">
    <span class="mark" aria-label="Volta">VOLTA</span>
    <nav aria-label="Sections">
      <a href="#story" data-nav="story"></a>
      <a href="#founders" data-nav="founders"></a>
      <a href="#timeline" data-nav="timeline"></a>
      <a href="#homes" data-nav="homes"></a>
      <a href="#honours" data-nav="honours"></a>
    </nav>
    <button class="lang" type="button" id="langToggle"></button>
  </header>

  <main>
    <section class="hero" aria-labelledby="heroTitle">
      <div class="stripes" aria-hidden="true"></div>
      <div class="hero-inner">
        <p class="year" id="heroYear" aria-hidden="true"></p>
        <h1 id="heroTitle"></h1>
        <p class="lead" id="heroLead"></p>
        <a class="cta" href="#story" id="heroCta"></a>
      </div>
    </section>

    <div class="rawshan" aria-hidden="true"></div>

    <section class="story" id="story" aria-labelledby="storyTitle">
      <div class="wrap two">
        <div>
          <h2 id="storyTitle"></h2>
          <div id="storyBody"></div>
        </div>
        <aside class="meaning">
          <p class="meaning-label" id="quoteLabel"></p>
          <p class="meaning-text" id="quoteText"></p>
        </aside>
      </div>
    </section>

    <section class="founders" id="founders" aria-labelledby="foundersTitle">
      <div class="wrap">
        <h2 id="foundersTitle"></h2>
        <p class="note" id="foundersNote"></p>
        <ul class="names" id="foundersList"></ul>
      </div>
    </section>

    <section class="timeline" id="timeline" aria-labelledby="timelineTitle">
      <div class="wrap">
        <h2 id="timelineTitle"></h2>
        <ol class="line" id="timelineList"></ol>
      </div>
    </section>

    <div class="rawshan" aria-hidden="true"></div>

    <section class="homes" id="homes" aria-labelledby="homesTitle">
      <div class="wrap">
        <h2 id="homesTitle"></h2>
        <div class="grounds" id="homesList"></div>
      </div>
    </section>

    <section class="honours" id="honours" aria-labelledby="honoursTitle">
      <div class="wrap">
        <h2 id="honoursTitle"></h2>
        <dl class="tally" id="honoursList"></dl>
      </div>
    </section>
  </main>

  <footer class="foot">
    <div class="wrap">
      <p class="disclaimer" id="disclaimer"></p>
      <div class="foot-cols">
        <div>
          <h3 id="creditsTitle"></h3>
          <p id="credits"></p>
        </div>
        <div>
          <h3 id="sourcesTitle"></h3>
          <ul id="sourcesList"></ul>
        </div>
      </div>
    </div>
  </footer>

  <script src="data/content.js"></script>
  <script src="app.js"></script>
</body>
</html>
